name: Versioned Docker Release

on:
  push:
    tags:
      - 'v*'  # Run only on version tags like v1.0, v1.1

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set version tag
        id: vars
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Images
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/versioned-app:$TAG ./Project3-Versioned-Release-Pipeline
          docker build -t ${{ secrets.DOCKER_USERNAME }}/versioned-app:latest ./Project3-Versioned-Release-Pipeline

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/versioned-app:$TAG
          docker push ${{ secrets.DOCKER_USERNAME }}/versioned-app:latest
