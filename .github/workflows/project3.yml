name: Versioned Docker Release

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'Project3-Versioned-Release-Pipeline/**'
      - '!Project2-Test-Before-Build-Pipeline/docs/**'

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Extract version
      id: vars
      run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/versioned-app:$TAG ./project3-versioned-release
        docker build -t ${{ secrets.DOCKER_USERNAME }}/versioned-app:latest ./project3-versioned-release

    - name: Push Docker Images
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/versioned-app:$TAG
        docker push ${{ secrets.DOCKER_USERNAME }}/versioned-app:latest
