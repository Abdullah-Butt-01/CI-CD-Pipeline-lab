name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Project1-Automatic-Docker-Build-Pipeline/**' #Worflow only runs if files under this folder change
      - '!Project1-Automatic-Docker-Build-Pipeline/docs/**'

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-demo:latest ./Project1-Automatic-Docker-Build-Pipeline # adding path of the folder

    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/cicd-demo:latest
