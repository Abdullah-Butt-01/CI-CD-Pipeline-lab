name: Test Before Docker Build

on: # when to trigger workflow
  push:
    paths:
      - 'Project2-Test-Before-Build-Pipeline/**'

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code    # download github repo onto the VM
      uses: actions/checkout@v3

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd Project2-Test-Before-Build-Pipeline
        pip install -r requirements.txt

    - name: Run tests
      run: |
        cd Project2-Test-Before-Build-Pipeline
        pytest

  build:

    needs: test

    runs-on: ubuntu-latest # Clean VM for building, each job runs independently on a new VM

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image # tag image as username/test-pipeline:latest
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/test-pipeline:latest ./Project2-Test-Before-Build-Pipeline

    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/test-pipeline:latest
